apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
      - name: my-registry-key-two
      containers:
      - name: my-app
        image: 211125446476.dkr.ecr.eu-central-1.amazonaws.com/kubernetes-demo/myapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000